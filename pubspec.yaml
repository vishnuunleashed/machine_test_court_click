name: machine_test_court_click
description: "Court Click Movies - a Netflix-style movie discovery app built on the TMDB API"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0

  # Networking
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1

  # State management
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0

  # Navigation & DI
  go_router: ^17.0.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/icons/

  fonts:
    - family: NetflixSans
      fonts:
        - asset: assets/fonts/NetflixSans-Rg.ttf
        - asset: assets/fonts/NetflixSans-Md.ttf
          weight: 500
        - asset: assets/fonts/NetflixSans-Bd.ttf
          weight: 700
